spring.application.name=suofenpu-backend
spring.config.import=optional:file:.env.local[.properties]

server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/suofenpu?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Shanghai

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.h2.console.enabled=false

wechat.mini-program.app-id=${WECHAT_APP_ID:}
wechat.mini-program.app-secret=${WECHAT_APP_SECRET:}
wechat.mini-program.dev-login-enabled=${WECHAT_DEV_LOGIN_ENABLED:false}

gallery.root-dir=${GALLERY_ROOT_DIR:${user.dir}/uploads/gallery}
gallery.public-prefix=${GALLERY_PUBLIC_PREFIX:/uploads/gallery}
gallery.max-storage-bytes=${GALLERY_MAX_STORAGE_BYTES:5368709120}
gallery.max-file-bytes=${GALLERY_MAX_FILE_BYTES:20971520}

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
