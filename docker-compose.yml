services:
  mysql:
    image: mysql:8.4
    container_name: suofenpu-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: suofenpu
      MYSQL_USER: suofenpu
      MYSQL_PASSWORD: suofenpu_dev
      MYSQL_ROOT_PASSWORD: root_dev
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - suofenpu-mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci

volumes:
  suofenpu-mysql-data:
